[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "seq-vp-tag"
version = "0.1.0"
description = "bayesreg: Bayesian tissue-aware registration with cellwise Jacobian certificates (jd_curl: frozen low-level library from seq_vp_3d eb808be)"
requires-python = ">=3.10"
dependencies = ["numpy==2.0.2", "scipy==1.15.2"]

[project.optional-dependencies]
test = ["pytest==9.0.3"]
mri = ["nibabel==5.4.0"]
plot = ["matplotlib==3.10.8"]
certificate = ["numba==0.65.0"]

[tool.setuptools.packages.find]
include = ["jd_curl*", "bayesreg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
junit_family = "legacy"
# slow tests are skipped by default; run them with `-m slow` (a later -m on the command line replaces this one)
addopts = "-m 'not slow'"
markers = ["slow: long-running gates (e.g. the S = 1e5 whitening test); deselected by default, run with -m slow"]
